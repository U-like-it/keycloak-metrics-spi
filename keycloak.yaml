extraInitContainers: |
    - name: spi-provider
      image: ulikeit-keycloak-metrics-spi:latest
      imagePullPolicy: Never
      command:
        - sh
      args:
        - -c
        - |
          echo "Copying spi..."
          cp /*.jar /deployments
          cp /*.dodeploy /deployments
      volumeMounts:
        - name: keycloak-spi
          mountPath: /deployments

extraVolumes: |
    - name: realm-secret
      configMap:
        name: realm-secret
    - name: keycloak-spi
      emptyDir: {}

extraVolumeMounts: |
    - name: realm-secret
      mountPath: "/realm/"
      readOnly: true
    - name: keycloak-spi
      mountPath: /opt/jboss/keycloak/standalone/deployments

extraEnv: |
    - name: JGROUPS_DISCOVERY_PROTOCOL
      value: kubernetes.KUBE_PING
    - name: KUBERNETES_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: CACHE_OWNERS_COUNT
      value: "2"
    - name: CACHE_OWNERS_AUTH_SESSIONS_COUNT
      value: "2"
    - name: PROXY_ADDRESS_FORWARDING
      value: "true"
    - name: KEYCLOAK_STATISTICS
      value: all
    - name: JAVA_OPTS
      value: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=50.0
        -Djboss.modules.system.pkgs=$JBOSS_MODULES_SYSTEM_PKGS
        -Djava.awt.headless=true
        -Djava.net.preferIPv4Stack=true
        -Dkeycloak.migration.provider=dir
        -Dkeycloak.migration.action=import
        -Dkeycloak.migration.strategy=IGNORE_EXISTING
        -Dkeycloak.migration.dir=/realm
        -Dkeycloak.profile.feature.upload_scripts=enabled
    - name: DB_VENDOR
      value: postgres
    - name: DB_ADDR
      value: ulikeit-database.default.svc.cluster.local
    - name: DB_PORT
      value: "5432"
    - name: DB_DATABASE
      value: keycloak
    - name: DB_USER
      valueFrom:
          secretKeyRef:
            name: keycloak.ulikeit-database.credentials.postgresql.acid.zalan.do
            key: username
    - name: DB_PASSWORD
      valueFrom:
          secretKeyRef:
            name: keycloak.ulikeit-database.credentials.postgresql.acid.zalan.do
            key: password
    - name: KEYCLOAK_USER
      value: admin
    - name: KEYCLOAK_PASSWORD
      value: Tea4me2N8

rbac:
    create: true
    rules:
        - apiGroups:
              - ""
          resources:
              - pods
          verbs:
              - get
              - list

serviceAccount:
    create: false
    name: ulikeit

service:
    type: NodePort
    httpPort: "8080"
    httpNodePort: "30800"
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/auth/realms/master/metrics"

postgresql:
    enabled: false

replicas: 4
ingres:
    enabled: false

autoscaling:
    enabled: true

serviceMonitor:
    # The chart's own ServiceMonitor scrapes /metrics on the WildFly management port 9990, and
    # Prometheus 3 refuses that response: the endpoint answers 200 but sends a blank Content-Type
    # ("non-compliant scrape target ... no fallback_scrape_protocol specified"). The target was
    # therefore permanently down from 2026-08-02, which kept KeycloakDown and TargetDown firing
    # while every login worked.
    #
    # Off, because the metrics are already collected twice over: the per-realm endpoints on 8080
    # (ServiceMonitor keycloak-metrics) and the nginx proxy that adds the missing header
    # (keycloak-wildfly-metrics-proxy), both defined in infrastructure/lib/charts.ts. The live
    # object was deleted by hand on 2026-08-15; this keeps the next `helm upgrade` from recreating
    # it. See infrastructure/docs/keycloak-monitoring.md.
    enabled: false
    namespace: default
extraServiceMonitor:
    enabled: false
    namespace: default

prometheusRule:
    enabled: true
